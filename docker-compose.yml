services:
  greencore-core:
    build:
      context: ./core
    image: ghcr.io/mmaashtalov/greencore-core:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      STATE_FILE: /app/data/state.json
      HISTORY_DATABASE: /app/data/history.sqlite
      SIMULATION_STATE_FILE: /app/data/simulations.json
      MAX_SIMULATION_REPORTS: 50
      MAX_SIMULATION_HISTORY: 1000
      MAX_TELEMETRY_HISTORY: 250000
      MAX_EVENT_HISTORY: 100000
      MAX_ALERT_HISTORY: 50000
      MAX_COMMAND_HISTORY: 100000
      MAX_POLICY_DECISION_HISTORY: 100000
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      AUTH_MODE: "${AUTH_MODE:-disabled}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-}"
      OPERATOR_API_KEY: "${OPERATOR_API_KEY:-}"
      CONTROLLER_API_KEYS: "${CONTROLLER_API_KEYS:-{}}"
      PUBLIC_READ_ONLY: "${PUBLIC_READ_ONLY:-false}"
      PUBLIC_SIMULATIONS: "${PUBLIC_SIMULATIONS:-false}"
      RATE_LIMIT_READ_PER_MINUTE: "${RATE_LIMIT_READ_PER_MINUTE:-240}"
      RATE_LIMIT_OPERATOR_PER_MINUTE: "${RATE_LIMIT_OPERATOR_PER_MINUTE:-120}"
      RATE_LIMIT_CONTROLLER_PER_MINUTE: "${RATE_LIMIT_CONTROLLER_PER_MINUTE:-1200}"
      RATE_LIMIT_SIMULATION_PER_MINUTE: "${RATE_LIMIT_SIMULATION_PER_MINUTE:-12}"
      RATE_LIMIT_STREAM_PER_MINUTE: "${RATE_LIMIT_STREAM_PER_MINUTE:-30}"
      RATE_LIMIT_MAX_IDENTITIES: "${RATE_LIMIT_MAX_IDENTITIES:-10000}"
      SIMULATION_MAX_CONCURRENT: "${SIMULATION_MAX_CONCURRENT:-1}"
      SIMULATION_MAX_QUEUE: "${SIMULATION_MAX_QUEUE:-4}"
      SIMULATION_RETRY_AFTER_SECONDS: "${SIMULATION_RETRY_AFTER_SECONDS:-2}"
      LIVE_HEARTBEAT_INTERVAL_MS: "${LIVE_HEARTBEAT_INTERVAL_MS:-15000}"
      LIVE_REPLAY_LIMIT: "${LIVE_REPLAY_LIMIT:-100}"
      LIVE_MAX_CLIENTS: "${LIVE_MAX_CLIENTS:-100}"
      LIVE_MAX_EVENT_BYTES: "${LIVE_MAX_EVENT_BYTES:-65536}"
      AUTOMATION_ENABLED: "true"
      EVALUATION_INTERVAL_MS: 5000
    volumes:
      - greencore-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  greencore-data:
