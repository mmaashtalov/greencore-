name: Deploy GreenCore Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build demo
        run: pnpm --filter @greencore/demo build

      - name: Validate publish payload
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/demo/dist/index.html
          test -s apps/demo/dist/fleet-mvp/index.html
          test -s apps/demo/dist/fleet-mvp/ux-freshness-v1.js
          grep --fixed-strings --quiet 'ux-freshness-v1.js?v=20260818-1' apps/demo/dist/fleet-mvp/index.html
          grep --fixed-strings --quiet "2026.08.18-fresh2" apps/demo/dist/fleet-mvp/ux-freshness-v1.js

      - name: Stage Pages payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/greencore-pages
          mkdir -p /tmp/greencore-pages
          cp -a apps/demo/dist/. /tmp/greencore-pages/
          touch /tmp/greencore-pages/.nojekyll

      - name: Publish to legacy gh-pages source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan pages-publish
          cp -a /tmp/greencore-pages/. .
          git add -A
          git commit -m "deploy: ${SOURCE_SHA}"
          git push --force origin HEAD:gh-pages

  verify:
    name: Verify published dashboard
    runs-on: ubuntu-latest
    needs: publish
    env:
      PAGE_URL: https://mmaashtalov.github.io/greencore-/
      FLEET_URL: https://mmaashtalov.github.io/greencore-/fleet-mvp/
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Smoke test live pages
        shell: bash
        run: |
          set -euo pipefail
          index_file="$(mktemp)"
          fleet_file="$(mktemp)"
          published=false
          for attempt in $(seq 1 36); do
            root_ok=false
            fleet_ok=false

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$PAGE_URL" --output "$index_file"; then
              asset_path="$(grep -oE 'src="[^\"]*assets/[^\"]+\.js"' "$index_file" | head -n 1 | cut -d '"' -f 2 || true)"
              if [ -n "$asset_path" ]; then
                asset_url="${PAGE_URL%/}/${asset_path#./}"
                if curl --fail --silent --show-error --location \
                  --connect-timeout 10 --max-time 30 \
                  "$asset_url" | grep --fixed-strings --quiet 'GREENCORE LIVE OPERATIONS'; then
                  root_ok=true
                fi
              fi
            fi

            if curl --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 30 \
              "$FLEET_URL" --output "$fleet_file" && \
              grep --fixed-strings --quiet 'ux-freshness-v1.js?v=20260818-1' "$fleet_file" && \
              curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                "${FLEET_URL}ux-freshness-v1.js?v=20260818-1" | grep --fixed-strings --quiet '2026.08.18-fresh2'; then
              fleet_ok=true
            fi

            if [ "$root_ok" = true ] && [ "$fleet_ok" = true ]; then
              published=true
              break
            fi
            sleep 10
          done

          if [ "$published" != true ]; then
            echo "Current dashboard/Fleet payload was not observed on GitHub Pages" >&2
            exit 1
          fi

          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          printf '{\n  "status": "verified",\n  "page_url": "%s",\n  "fleet_url": "%s",\n  "source_sha": "%s",\n  "verified_at": "%s",\n  "marker": "GREENCORE LIVE OPERATIONS",\n  "fleet_startup_fix": "2026.08.18-fresh2"\n}\n' \
            "$PAGE_URL" "$FLEET_URL" "$SOURCE_SHA" "$verified_at" > /tmp/pages-status.json

      - name: Publish verifiable deployment status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan pages-status
          cp /tmp/pages-status.json status.json
          git add status.json
          git commit -m "chore(pages): record verified deployment ${SOURCE_SHA}"
          git push --force origin HEAD:pages-status
