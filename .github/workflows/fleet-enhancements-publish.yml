name: Publish Fleet Enhancements

on:
  push:
    branches: [main]
    paths:
      - 'apps/demo/public/fleet-mvp/**'
      - '.github/workflows/fleet-enhancements-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-enhancements-publish
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical Fleet bundle
        shell: bash
        run: |
          set -euo pipefail
          cd source/apps/demo/public/fleet-mvp
          python - <<'PY'
          from pathlib import Path
          import json, re

          html = Path('index.html').read_text(encoding='utf-8')
          direct_refs = re.findall(r'(?:src|href)="\.\/([^"?]+)', html)
          duplicate_direct = sorted({ref for ref in direct_refs if direct_refs.count(ref) > 1})
          if duplicate_direct:
              raise SystemExit('Duplicate index references: ' + ', '.join(duplicate_direct))

          role_loader = Path('ux-role-loader-v1.js')
          lazy_refs = []
          if role_loader.is_file():
              role_text = role_loader.read_text(encoding='utf-8')
              lazy_refs = re.findall(r"['\"]\.\/([^'\"?]+\.(?:js|css))(?:\?[^'\"]*)?['\"]", role_text)

          refs = list(dict.fromkeys(direct_refs + lazy_refs))
          missing = [ref for ref in refs if not Path(ref).is_file()]
          if missing:
              raise SystemExit('Missing referenced files: ' + ', '.join(missing))

          manifest = json.loads(Path('manifest.webmanifest').read_text(encoding='utf-8'))
          for icon in manifest.get('icons', []):
              src = icon.get('src','').removeprefix('./').split('?',1)[0]
              if src and not Path(src).is_file():
                  raise SystemExit('Missing manifest icon: ' + src)

          js_refs = [ref for ref in refs if ref.endswith('.js')]
          Path('/tmp/fleet_js_refs.txt').write_text('\n'.join(js_refs), encoding='utf-8')
          print(f'Validated Fleet assets: {len(refs)} total, {len(js_refs)} JavaScript')
          PY

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            node --check "$file"
          done < /tmp/fleet_js_refs.txt
          node --check sw.js

      - name: Checkout public branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Sync complete Fleet bundle
        shell: bash
        run: |
          set -euo pipefail
          src='source/apps/demo/public/fleet-mvp'
          dst='public/fleet-mvp'
          mkdir -p "$dst"
          find "$src" -maxdepth 1 -type f -print0 | while IFS= read -r -d '' file; do
            cp "$file" "$dst/$(basename "$file")"
          done

      - name: Commit public Fleet
        working-directory: public
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- fleet-mvp; then
            echo "Fleet public files already current"
            exit 0
          fi
          git add fleet-mvp
          git commit -m "feat(fleet-demo): publish canonical Fleet bundle"
          git push origin HEAD:gh-pages
