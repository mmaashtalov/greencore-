name: Publish Fleet Enhancements

on:
  push:
    branches: [main]
    paths:
      - 'apps/demo/public/fleet-mvp/**'
      - '.github/workflows/fleet-enhancements-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fleet-enhancements-publish
  cancel-in-progress: true

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          cd source/apps/demo/public/fleet-mvp
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)="\.\/([^"?]+)', html)
          missing = [ref for ref in refs if not Path(ref).is_file()]
          if missing:
              raise SystemExit('Missing referenced files: ' + ', '.join(missing))
          duplicates = sorted({ref for ref in refs if refs.count(ref) > 1})
          if duplicates:
              raise SystemExit('Duplicate references: ' + ', '.join(duplicates))
          Path('/tmp/fleet_refs.txt').write_text('\n'.join(refs), encoding='utf-8')
          print('Canonical refs:', ', '.join(refs))
          PY
          while IFS= read -r file; do
            case "$file" in
              *.js) node --check "$file" ;;
            esac
          done < /tmp/fleet_refs.txt

      - name: Checkout public branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public

      - name: Sync canonical Fleet files
        shell: bash
        run: |
          set -euo pipefail
          src='source/apps/demo/public/fleet-mvp'
          dst='public/fleet-mvp'
          mkdir -p "$dst"
          cp "$src/index.html" "$dst/index.html"
          while IFS= read -r file; do
            cp "$src/$file" "$dst/$file"
          done < /tmp/fleet_refs.txt

      - name: Commit public Fleet
        working-directory: public
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- fleet-mvp; then
            echo "Fleet public files already current"
            exit 0
          fi
          git add fleet-mvp
          git commit -m "feat(fleet-demo): publish canonical Fleet build"
          git push origin HEAD:gh-pages
