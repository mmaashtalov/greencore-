name: GreenCore Container

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'docker-compose.yml'
      - '.github/workflows/container.yml'
  pull_request:
    paths:
      - 'core/**'
      - 'docker-compose.yml'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: greencore-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container for smoke test
        uses: docker/build-push-action@v6
        with:
          context: core
          load: true
          push: false
          tags: greencore-core:smoke

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 127.0.0.1::3000 greencore-core:smoke)"
          trap 'docker logs "$container_id" || true; docker rm --force "$container_id" || true' EXIT
          host_port="$(docker inspect --format='{{(index (index .NetworkSettings.Ports "3000/tcp") 0).HostPort}}' "$container_id")"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${host_port}/health" > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          grep --fixed-strings --quiet '"status":"ok"' /tmp/health.json
          curl --fail --silent --show-error "http://127.0.0.1:${host_port}/simulations/catalog" > /tmp/catalog.json
          grep --fixed-strings --quiet 'baseline_24h' /tmp/catalog.json
          test "$(docker inspect --format='{{.State.Health.Status}}' "$container_id")" != "unhealthy"

      - name: Publish container image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: core
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/greencore-core:latest
            ghcr.io/${{ github.repository_owner }}/greencore-core:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=GreenCore Core
            org.opencontainers.image.description=Smart greenhouse runtime and public simulation API
