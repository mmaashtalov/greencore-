name: Fleet Production Smoke

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'apps/fleet-prod/**'
      - '.github/workflows/fleet-prod-smoke.yml'
  pull_request:
    paths:
      - 'apps/fleet-prod/**'
      - '.github/workflows/fleet-prod-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-prod-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate production shell and modules
        shell: bash
        run: |
          set -euo pipefail
          cd apps/fleet-prod
          python - <<'PY'
          from pathlib import Path
          import re

          html=Path('index.html').read_text(encoding='utf-8')
          if 'fleet-mvp/demo базе' in html or 'MVP' in html or 'Демонстрационный' in html:
              raise SystemExit('Production shell contains demo branding')
          if 'runtime-config.js' not in html or 'prod-bootstrap.js' not in html:
              raise SystemExit('Production shell must use runtime config and fail-closed bootstrap')
          if 'tikjmiyrhkcjrxjylmqb.supabase.co' in html:
              raise SystemExit('Production shell is directly wired to demo Supabase')

          cfg=Path('runtime-config.js').read_text(encoding='utf-8')
          if '__SUPABASE_URL__' not in cfg or '__SUPABASE_PUBLISHABLE_KEY__' not in cfg:
              raise SystemExit('Committed production runtime config must remain deployment-templated')

          bootstrap=Path('prod-bootstrap.js').read_text(encoding='utf-8')
          for token in ['DEMO_REF','Production запрещено запускать на fleet-mvp/demo базе','sb_publishable_','prod-hardening-v1.js']:
              if token not in bootstrap: raise SystemExit('Bootstrap contract missing: '+token)
          imported=re.findall(r"['\"]\.\/([^'\"?]+)(?:\?[^'\"]*)?['\"]",bootstrap)
          missing=[p for p in imported if not Path(p).is_file()]
          if missing: raise SystemExit('Bootstrap references missing files: '+', '.join(missing))

          hardening=Path('prod-hardening-v1.js').read_text(encoding='utf-8')
          for token in ['LEGACY_DEMO_URL','__FLEET_PROD_CONFIG__','globalThis.fetch=async function fleetProdFetch','/auth/v1/logout?scope=local','current_fleet_timezone','Intl.DateTimeFormat=FleetDateTimeFormat','prodZonedLocalToDate','e.stopImmediatePropagation()']:
              if token not in hardening: raise SystemExit('Hardening contract missing: '+token)

          sw=Path('sw.js').read_text(encoding='utf-8')
          for token in ["fleet-prod-shell-","self.registration.scope","cacheModuleTree"]:
              if token not in sw: raise SystemExit('Production service worker contract missing: '+token)

          manifest=Path('manifest.webmanifest').read_text(encoding='utf-8')
          if 'Демонстрационный' in manifest or 'MVP' in manifest:
              raise SystemExit('Production manifest contains demo branding')

          loader=Path('ux-role-loader-v1.js').read_text(encoding='utf-8')
          lazy=re.findall(r"['\"]\.\/([^'\"?]+)(?:\?[^'\"]*)?['\"]",loader)
          lazy_missing=[p for p in lazy if not Path(p).is_file()]
          if lazy_missing: raise SystemExit('Role loader references missing files: '+', '.join(lazy_missing))
          if re.search(r"js\s*:\s*\[[^\]]*\.css(?:\?|['\"])",loader,re.S):
              raise SystemExit('CSS file leaked into JS role bundle')
          if loader.find('loaded.add(role)') < loader.find('if(failures.length)'):
              raise SystemExit('Role loader marks bundle ready before failure check')

          all_js=sorted(set(['runtime-config.js','prod-bootstrap.js','prod-hardening-v1.js','sw.js']+imported+lazy))
          Path('/tmp/fleet_prod_js.txt').write_text('\n'.join(p for p in all_js if p.endswith('.js')),encoding='utf-8')
          print(f'Production modules checked: {len(all_js)}')
          PY
          while IFS= read -r file; do
            test -s "$file"
            node --check "$file"
          done < /tmp/fleet_prod_js.txt
