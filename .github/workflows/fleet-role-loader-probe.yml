name: Fleet Role Loader Probe

on:
  push:
    branches: ['agent/mobile-responsive-fixes-20260818']
    paths:
      - 'apps/demo/public/fleet-mvp/**'
      - '.github/workflows/fleet-role-loader-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-role-loader-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          npm install --no-save @playwright/test@latest
          npx playwright install --with-deps chromium
      - shell: bash
        run: |
          python3 -m http.server 4173 --directory apps/demo/public >/tmp/fleet-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/fleet-mvp/ >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - run: npx playwright test apps/demo/public/fleet-mvp/e2e/role-loader-probe.spec.cjs --workers=1 --reporter=line --timeout=20000
