name: Fleet Public Smoke

on:
  push:
    branches: [main, 'hotfix/**']
    paths:
      - 'apps/demo/public/fleet-mvp/**'
      - '.github/workflows/fleet-public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-public-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical Fleet manifest and role bundles
        shell: bash
        run: |
          set -euo pipefail
          cd apps/demo/public/fleet-mvp
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path('index.html').read_text(encoding='utf-8')
          direct = re.findall(r'(?:src|href)="\.\/([^"?]+)', html)
          missing = [ref for ref in direct if not Path(ref).is_file()]
          if missing:
              raise SystemExit('Missing directly referenced files: ' + ', '.join(missing))
          duplicates = sorted({ref for ref in direct if direct.count(ref) > 1})
          if duplicates:
              raise SystemExit('Duplicate direct references: ' + ', '.join(duplicates))

          loader = Path('ux-role-loader-v1.js').read_text(encoding='utf-8')
          lazy = re.findall(r"['\"]\.\/([^'\"?]+)(?:\?[^'\"]*)?['\"]", loader)
          lazy_missing = [ref for ref in lazy if not Path(ref).is_file()]
          if lazy_missing:
              raise SystemExit('Missing role-bundle files: ' + ', '.join(lazy_missing))

          forbidden_initial = {
              'license-validity-patch.js','period-patch.js','period-readiness-patch.js','quality-resolution-patch.js','ux-quality-modal-v1.js',
              'attention-router-patch.js','review-patch.js','review-details-patch.js','approval-guard-patch.js','state-action-patch.js',
              'service-workflow-patch.js','service-context-fix.js','maintenance-lifecycle-patch.js','create-form-patch.js','assignment-patch.js',
              'incident-package-patch.js','fleet-patch.js','fleet-clarity-patch.js','waybills-list-patch.js','statement-print-patch.js','waybill-print-patch.js',
              'ux-modal-form-v1.js','entity-card-patch.js','vehicle-command-patch.js','vehicle-history-patch.js','trailer-edit-fix.js',
              'connectivity-patch.js','ux-connectivity-v1.js','offline-home-patch.js','driver-access-patch.js','driver-attention-patch.js','driver-correction-patch.js',
              'ux-driver-state-v1.js','ux-driver-form-v1.js','ux-driver-draft-v1.js','ux-global-search-v1.js','ux-filter-v1.js','ux-breadcrumb-v1.js'
          }
          leaked = sorted(forbidden_initial.intersection(direct))
          if leaked:
              raise SystemExit('Role-specific JS leaked into initial bundle: ' + ', '.join(leaked))

          required_lazy = {
              'ux-session-boundary-v1.js','license-validity-patch.js','period-patch.js','period-readiness-patch.js','quality-resolution-patch.js','ux-quality-modal-v1.js',
              'attention-router-patch.js','review-patch.js','review-details-patch.js','approval-guard-patch.js','state-action-patch.js',
              'service-workflow-patch.js','service-context-fix.js','maintenance-lifecycle-patch.js','create-form-patch.js','assignment-patch.js',
              'incident-package-patch.js','fleet-patch.js','fleet-clarity-patch.js','waybills-list-patch.js','statement-print-patch.js','waybill-print-patch.js',
              'ux-modal-form-v1.js','entity-card-patch.js','vehicle-command-patch.js','vehicle-history-patch.js','trailer-edit-fix.js',
              'connectivity-patch.js','ux-connectivity-v1.js','offline-home-patch.js','driver-access-patch.js','driver-attention-patch.js','driver-correction-patch.js',
              'ux-driver-state-v1.js','ux-driver-form-v1.js','ux-driver-draft-v1.js','ux-global-search-v1.js','ux-filter-v1.js','ux-breadcrumb-v1.js',
              'ux-responsibility-v1.js','ux-recent-work-v1.js'
          }
          absent = sorted(required_lazy.difference(lazy))
          if absent:
              raise SystemExit('Required role-bundle modules absent: ' + ', '.join(absent))

          session_pos = loader.find('./ux-session-boundary-v1.js')
          connectivity_pos = loader.find('./connectivity-patch.js')
          if session_pos < 0 or connectivity_pos < 0 or session_pos > connectivity_pos:
              raise SystemExit('Session boundary must load before connectivity engine')

          all_js = sorted({ref for ref in direct + lazy if ref.endswith('.js')})
          Path('/tmp/fleet_js.txt').write_text('\n'.join(all_js), encoding='utf-8')
          print(f'Direct refs OK: {len(direct)}; lazy refs OK: {len(lazy)}; JS checked: {len(all_js)}')
          PY
          while IFS= read -r file; do
            test -s "$file"
            node --check "$file"
          done < /tmp/fleet_js.txt

  browser-e2e:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@latest
          npx playwright install --with-deps chromium

      - name: Start Fleet static fixture
        shell: bash
        run: |
          python3 -m http.server 4173 --directory apps/demo/public >/tmp/fleet-http.log 2>&1 &
          echo $! >/tmp/fleet-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/fleet-mvp/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fleet-http.log
          exit 1

      - name: Run authenticated Android startup contract
        run: npx playwright test apps/demo/public/fleet-mvp/e2e/mobile-startup.spec.cjs --workers=1 --reporter=line
