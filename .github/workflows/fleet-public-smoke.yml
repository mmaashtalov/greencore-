name: Fleet Public Smoke

on:
  push:
    branches: [main]
    paths:
      - 'apps/demo/public/fleet-mvp/**'
      - '.github/workflows/fleet-public-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-public-smoke
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate canonical Fleet manifest
        shell: bash
        run: |
          set -euo pipefail
          cd apps/demo/public/fleet-mvp
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          refs = re.findall(r'(?:src|href)="\.\/([^"?]+)', html)
          missing = [ref for ref in refs if not Path(ref).is_file()]
          if missing:
              raise SystemExit('Missing referenced files: ' + ', '.join(missing))
          duplicates = sorted({ref for ref in refs if refs.count(ref) > 1})
          if duplicates:
              raise SystemExit('Duplicate references: ' + ', '.join(duplicates))
          js = [ref for ref in refs if ref.endswith('.js')]
          Path('/tmp/fleet_js.txt').write_text('\n'.join(js), encoding='utf-8')
          print('References OK:', ', '.join(refs))
          PY
          while IFS= read -r file; do
            test -s "$file"
            node --check "$file"
          done < /tmp/fleet_js.txt
