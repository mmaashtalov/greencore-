name: One-shot deploy Fleet MVP demo

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-fleet-mvp.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout existing Pages branch
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Download verified Fleet build artifact
        run: |
          curl --fail --location 'https://sdmntprwestus.oaiusercontent.com/files/00000000-f900-8230-b9ea-45f806ce6d6f/raw?se=2026-08-14T09%3A08%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=6b649885-5ed0-56de-a3b0-0b5eaeb28400&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-14T04%3A54%3A33Z&ske=2026-08-15T04%3A54%3A33Z&sks=b&skv=2026-02-06&sig=lARyusImwQSCAOTw7F9W57YAguu6hTzacCtmXcrWXNI%3D' -o /tmp/fleet-pages-artifact.zip
          mkdir -p /tmp/pages-artifact /tmp/fleet-dist
          unzip -q /tmp/fleet-pages-artifact.zip -d /tmp/pages-artifact
          tar -xf /tmp/pages-artifact/artifact.tar -C /tmp/fleet-dist

      - name: Rebase static paths for public demo subdirectory
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('/tmp/fleet-dist')
          old = b'/acsp/'
          new = b'/greencore-/fleet-mvp/'
          for path in root.rglob('*'):
              if path.is_file():
                  data = path.read_bytes()
                  if old in data:
                      path.write_bytes(data.replace(old, new))
          PY

      - name: Publish only Fleet subdirectory
        run: |
          rm -rf site/fleet-mvp
          mkdir -p site/fleet-mvp
          cp -R /tmp/fleet-dist/. site/fleet-mvp/
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fleet-mvp
          git diff --cached --quiet && exit 0
          git commit -m 'Deploy Fleet MVP demo'
          git push origin gh-pages
