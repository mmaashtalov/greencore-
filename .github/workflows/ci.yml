name: GreenCore CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      # Render Blueprint validation is intentionally manual in render-blueprint.yml:
      # it requires an authenticated, explicit Render workspace.
