name: Fleet Mobile Responsive

on:
  push:
    branches: [main, 'agent/**', 'hotfix/**']
    paths:
      - 'apps/demo/public/fleet-mvp/**'
      - '.github/workflows/fleet-mobile-responsive.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/demo/public/fleet-mvp/**'
      - '.github/workflows/fleet-mobile-responsive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-mobile-responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-responsive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate mobile contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check apps/demo/public/fleet-mvp/e2e/mobile-responsive-v3.spec.cjs
          node --check apps/demo/public/fleet-mvp/ux-role-loader-v1.js
          node --check apps/demo/public/fleet-mvp/connectivity-patch.js
          node --check apps/demo/public/fleet-mvp/attention-router-patch.js
          grep --fixed-strings --quiet 'viewport-fit=cover' apps/demo/public/fleet-mvp/index.html
          grep --fixed-strings --quiet 'env(safe-area-inset-top)' apps/demo/public/fleet-mvp/mobile-responsive-hardening.css
          grep --fixed-strings --quiet 'env(safe-area-inset-bottom)' apps/demo/public/fleet-mvp/mobile-responsive-hardening.css
          grep --fixed-strings --quiet '100dvh' apps/demo/public/fleet-mvp/mobile-responsive-hardening.css
          grep --fixed-strings --quiet 'grid-auto-columns:minmax(0,1fr)' apps/demo/public/fleet-mvp/mobile-responsive-hardening.css
          grep --fixed-strings --quiet 'roleUxReady' apps/demo/public/fleet-mvp/ux-role-loader-v1.js
          grep --fixed-strings --quiet 'connectivity-patch.js?v=20260818-2' apps/demo/public/fleet-mvp/ux-role-loader-v1.js
          grep --fixed-strings --quiet 'attention-router-patch.js?v=20260818-3' apps/demo/public/fleet-mvp/ux-role-loader-v1.js

      - name: Install Playwright
        run: |
          npm install --no-save @playwright/test@latest
          npx playwright install --with-deps chromium

      - name: Start Fleet static fixture
        shell: bash
        run: |
          python3 -m http.server 4173 --directory apps/demo/public >/tmp/fleet-http.log 2>&1 &
          echo $! >/tmp/fleet-http.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/fleet-mvp/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/fleet-http.log
          exit 1

      - name: Run fully hydrated responsive matrix
        run: npx playwright test apps/demo/public/fleet-mvp/e2e/mobile-responsive-v3.spec.cjs --workers=1 --reporter=line --timeout=45000
