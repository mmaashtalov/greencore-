<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GreenCore — эмулятор умной теплицы</title><style>body{margin:0;background:#07110e;color:#e9fff6;font-family:Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.brand{font-size:28px;font-weight:800}.sub{color:#91b7a7}.controls{display:flex;gap:8px;flex-wrap:wrap}button{background:#16382d;color:#eafff6;border:1px solid #2f6b57;border-radius:10px;padding:10px 14px;font-weight:700}.active{background:#1f8f67}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{background:#0d1d18;border:1px solid #1f3a31;border-radius:16px;padding:16px}.title{font-size:20px;font-weight:800;margin-bottom:10px}.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.m{background:#102820;border-radius:12px;padding:11px}.k{font-size:12px;color:#86a99b}.v{font-size:22px;font-weight:800;margin-top:3px}.status{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#152f27}.on{background:#145c42}.delta{margin-top:14px;padding:14px;border-radius:14px;background:#10251f;font-weight:700}.good{color:#73efb6}.bad{color:#ff9a9a}.footer{margin-top:16px;color:#759486;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.brand{font-size:23px}.metrics{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">GreenCore</div><div class="sub">Публичный эмулятор: автоматическое управление против ручного</div></div><div class="controls"><button id="play" class="active">Пауза</button><button data-speed="60">×60</button><button data-speed="300" class="active">×300</button><button data-speed="1200">×1200</button><button id="reset">Сброс</button></div></div><div id="time" class="delta">Симулировано: 0 ч</div><div class="grid"><div class="card"><div class="title">GreenCore — автоматический режим</div><div id="auto"></div></div><div class="card"><div class="title">Ручное управление</div><div id="manual"></div></div></div><div id="compare" class="delta"></div><div class="footer">Оба сценария используют одинаковую погоду и цены. Отличается только логика управления.</div></div><script>const cfg={crop:180,water:.08,power:8,nominal:100};let running=true,speed=300;const init=()=>({min:0,tIn:23,tOut:18,hum:65,soil:55,health:100,stress:0,growth:0,yield:100,loss:0,water:0,kwh:0,pump:false,fan:false});let A=init(),M=init();function step(s,auto,dt){const min=s.min+dt,phase=(min%1440)/1440,solar=Math.max(0,Math.sin((phase-.25)*Math.PI*2)),tout=15+solar*17;let pump=s.pump,fan=s.fan;if(auto){if(s.soil<43)pump=true;if(s.soil>58)pump=false;if(s.tIn>28)fan=true;if(s.tIn<24.5)fan=false}else{pump=min%360<25;fan=false}const tin=s.tIn+solar*.14*dt+(tout-s.tIn)*.012*dt-(fan?.12*dt:0);const soil=Math.max(0,Math.min(100,s.soil+(pump?.42*dt:0)-(.035+solar*.055+Math.max(0,tin-25)*.008)*dt));const ts=Math.max(0,tin-30)+Math.max(0,15-tin)*.5,ws=Math.max(0,38-soil)*.35,sr=(ts+ws)*dt/60,stress=Math.max(0,s.stress+sr-.025*dt),ld=stress>12?(stress-12)*.00045*dt:0,loss=Math.min(cfg.nominal,s.loss+ld),health=Math.max(0,100-stress*1.4-loss*.7),growth=s.growth+Math.max(0,1-sr*.06)*(.25+solar*.75)*.0025*dt;return{min,tIn:tin,tOut:tout,hum:Math.max(25,Math.min(95,s.hum+(pump?.08:-.02)*dt)),soil,health,stress,growth,yield:Math.max(0,cfg.nominal-loss),loss,water:s.water+(pump?3.2*dt:0),kwh:s.kwh+((pump?.75:0)+(fan?1.2:0))*dt/60,pump,fan}}function econ(s){const rev=s.yield*cfg.crop,cost=s.water*cfg.water+s.kwh*cfg.power;return{rev,cost,profit:rev-cost}}function box(s){const e=econ(s);return `<div class="status"><span class="pill ${s.pump?'on':''}">Насос: ${s.pump?'ВКЛ':'ВЫКЛ'}</span><span class="pill ${s.fan?'on':''}">Вентиляция: ${s.fan?'ВКЛ':'ВЫКЛ'}</span></div><div class="metrics"><div class="m"><div class="k">Температура</div><div class="v">${s.tIn.toFixed(1)}°C</div></div><div class="m"><div class="k">Влажность почвы</div><div class="v">${s.soil.toFixed(1)}%</div></div><div class="m"><div class="k">Здоровье растений</div><div class="v">${s.health.toFixed(1)}%</div></div><div class="m"><div class="k">Прогноз урожая</div><div class="v">${s.yield.toFixed(1)} кг</div></div><div class="m"><div class="k">Потеря урожая</div><div class="v">${s.loss.toFixed(2)} кг</div></div><div class="m"><div class="k">Вода</div><div class="v">${s.water.toFixed(0)} л</div></div><div class="m"><div class="k">Электроэнергия</div><div class="v">${s.kwh.toFixed(1)} кВт·ч</div></div><div class="m"><div class="k">Прогноз прибыли</div><div class="v">${Math.round(e.profit).toLocaleString('ru-RU')} ₽</div></div></div>`}function render(){document.getElementById('auto').innerHTML=box(A);document.getElementById('manual').innerHTML=box(M);document.getElementById('time').textContent='Симулировано: '+(A.min/60).toFixed(1)+' ч';const ea=econ(A),em=econ(M),d=ea.profit-em.profit;document.getElementById('compare').innerHTML=`Преимущество GreenCore: <span class="${d>=0?'good':'bad'}">${Math.round(d).toLocaleString('ru-RU')} ₽</span> по прогнозной прибыли; сохранено ${(M.loss-A.loss).toFixed(2)} кг урожая.`}setInterval(()=>{if(!running)return;const dt=Math.max(1,Math.round(speed/60));A=step(A,true,dt);M=step(M,false,dt);render()},200);document.getElementById('play').onclick=e=>{running=!running;e.target.textContent=running?'Пауза':'Продолжить';e.target.classList.toggle('active',running)};document.getElementById('reset').onclick=()=>{A=init();M=init();render()};document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=+b.dataset.speed;document.querySelectorAll('[data-speed]').forEach(x=>x.classList.toggle('active',x===b))});render();</script></body></html>
